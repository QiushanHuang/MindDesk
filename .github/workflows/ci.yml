name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Capture source identity and enforce package policy
        shell: bash
        run: |
          set -euo pipefail
          ./script/verify_release_worktree.sh
          test -z "$(git status --short)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
          ./script/verify_s0_private_canvas.sh --repo-root "$GITHUB_WORKSPACE" --package-manifest-only

      - name: Direct private Release evidence
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/minddesk-ci-direct.XXXXXX")"
          evidence="$(mktemp -d "$RUNNER_TEMP/minddesk-ci-evidence.XXXXXX")"
          trap 'rm -rf -- "$scratch" "$evidence"' EXIT
          swift build --package-path "$GITHUB_WORKSPACE" --scratch-path "$scratch" -c release
          bin_dir="$(swift build --package-path "$GITHUB_WORKSPACE" --scratch-path "$scratch" -c release --show-bin-path)"
          description="$(find -P "$scratch" -type f -path '*/release/description.json' -print -quit)"
          ./script/verify_s0_private_canvas.sh --repo-root "$GITHUB_WORKSPACE" --scratch-path "$scratch" \
            --configuration release --build-description "$description" --evidence-dir "$evidence" --binary "$bin_dir/MindDesk"
          shasum -a 256 "$bin_dir/MindDesk"
          ./script/verify_release_worktree.sh
          test "$SOURCE_HEAD" = "$(git rev-parse HEAD)"

      - name: Debug and Release suites
        shell: bash
        run: |
          swift test --scratch-path "$RUNNER_TEMP/minddesk-ci-debug" -c debug
          swift test --scratch-path "$RUNNER_TEMP/minddesk-ci-release" -c release

      - name: Release script self-tests
        shell: bash
        run: |
          bash -n script/package_release.sh
          bash -n script/verify_release_artifacts.sh
          bash -n script/test_release_artifact_verifier.sh
          bash -n script/test_release_package_failure_diagnostics.sh
          bash -n script/test_release_workflow_guards.sh
          bash -n script/verify_release_worktree.sh
          bash -n script/test_release_worktree_guard.sh
          bash script/test_verify_s0_private_canvas.sh
          bash script/test_release_artifact_verifier.sh
          bash script/test_release_package_failure_diagnostics.sh
          bash script/test_release_workflow_guards.sh
          bash script/test_release_worktree_guard.sh

      - name: Package ad-hoc release smoke
        shell: bash
        env:
          RELEASE_PLATFORM_SUFFIX: macOS-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ./script/package_release.sh --mode adhoc --allow-adhoc
          version="$(tr -d '[:space:]' <VERSION)"
          artifact_dir="dist/release/MindDesk-v${version}-${RELEASE_PLATFORM_SUFFIX}-adhoc/artifacts"
          ./script/verify_release_artifacts.sh --artifact-dir "$artifact_dir" --source-head "$SOURCE_HEAD" \
            --version "$version" --suffix "$RELEASE_PLATFORM_SUFFIX" --mode adhoc

      - name: Export verified release paths and digests
        id: verified_release_artifacts
        shell: bash
        env:
          RELEASE_PLATFORM_SUFFIX: macOS-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' <VERSION)"
          dir="dist/release/MindDesk-v${version}-${RELEASE_PLATFORM_SUFFIX}-adhoc/artifacts"
          name="MindDesk-v${version}-${RELEASE_PLATFORM_SUFFIX}-adhoc"
          emit() { key="$1"; path="$2"; echo "${key}_path=$path" >>"$GITHUB_OUTPUT"; echo "${key}_sha256=$(shasum -a 256 "$path" | awk '{print $1}')" >>"$GITHUB_OUTPUT"; }
          emit zip "$dir/$name.zip"
          emit dmg "$dir/$name.dmg"
          emit build_provenance "$dir/build-provenance.json"
          emit normalized_plan "$dir/normalized-build-plan.json"
          emit source_policy "$dir/source-policy-evidence.json"
          emit pre_sign_manifest "$dir/pre-sign.bundle.manifest.json"
          emit final_app_manifest "$dir/final-app.bundle.manifest.json"
          emit verified_artifacts "$dir/verified-artifacts.json"
          emit checksums "$dir/SHA256SUMS.txt"

      - name: Recheck exported release digests
        shell: bash
        env:
          ZIP_PATH: ${{ steps.verified_release_artifacts.outputs.zip_path }}
          ZIP_SHA: ${{ steps.verified_release_artifacts.outputs.zip_sha256 }}
          DMG_PATH: ${{ steps.verified_release_artifacts.outputs.dmg_path }}
          DMG_SHA: ${{ steps.verified_release_artifacts.outputs.dmg_sha256 }}
          PROVENANCE_PATH: ${{ steps.verified_release_artifacts.outputs.build_provenance_path }}
          PROVENANCE_SHA: ${{ steps.verified_release_artifacts.outputs.build_provenance_sha256 }}
          PLAN_PATH: ${{ steps.verified_release_artifacts.outputs.normalized_plan_path }}
          PLAN_SHA: ${{ steps.verified_release_artifacts.outputs.normalized_plan_sha256 }}
          POLICY_PATH: ${{ steps.verified_release_artifacts.outputs.source_policy_path }}
          POLICY_SHA: ${{ steps.verified_release_artifacts.outputs.source_policy_sha256 }}
          PRE_PATH: ${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_path }}
          PRE_SHA: ${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_sha256 }}
          FINAL_PATH: ${{ steps.verified_release_artifacts.outputs.final_app_manifest_path }}
          FINAL_SHA: ${{ steps.verified_release_artifacts.outputs.final_app_manifest_sha256 }}
          VERIFIED_PATH: ${{ steps.verified_release_artifacts.outputs.verified_artifacts_path }}
          VERIFIED_SHA: ${{ steps.verified_release_artifacts.outputs.verified_artifacts_sha256 }}
          CHECKSUMS_PATH: ${{ steps.verified_release_artifacts.outputs.checksums_path }}
          CHECKSUMS_SHA: ${{ steps.verified_release_artifacts.outputs.checksums_sha256 }}
        run: |
          for pair in ZIP DMG PROVENANCE PLAN POLICY PRE FINAL VERIFIED CHECKSUMS; do
            eval "path=\${${pair}_PATH}"; eval "expected=\${${pair}_SHA}"
            test "$(shasum -a 256 "$path" | awk '{print $1}')" = "$expected"
          done

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: minddesk-private-canvas-release
          path: |
            ${{ steps.verified_release_artifacts.outputs.zip_path }}
            ${{ steps.verified_release_artifacts.outputs.dmg_path }}
            ${{ steps.verified_release_artifacts.outputs.build_provenance_path }}
            ${{ steps.verified_release_artifacts.outputs.normalized_plan_path }}
            ${{ steps.verified_release_artifacts.outputs.source_policy_path }}
            ${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_path }}
            ${{ steps.verified_release_artifacts.outputs.final_app_manifest_path }}
            ${{ steps.verified_release_artifacts.outputs.verified_artifacts_path }}
            ${{ steps.verified_release_artifacts.outputs.checksums_path }}

      - name: Check whitespace
        run: git diff --check
