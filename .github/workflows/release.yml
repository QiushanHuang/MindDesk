name: Release

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a draft GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release ref and choose suffix
        id: release_suffix
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish_github_release }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' <VERSION)"
          [[ "$GITHUB_REF_TYPE" == tag || "$GITHUB_REF_NAME" == main ]]
          [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$PUBLISH" != true || "$GITHUB_REF_TYPE" == tag ]]
          arch="$(printf '%s' "${RUNNER_ARCH:-unknown}" | tr '[:upper:]' '[:lower:]')"
          echo "RELEASE_PLATFORM_SUFFIX=macOS-${arch}" >>"$GITHUB_ENV"
          echo "release_platform_suffix=macOS-${arch}" >>"$GITHUB_OUTPUT"

      - name: Capture source identity and enforce package policy
        shell: bash
        run: |
          set -euo pipefail
          ./script/verify_release_worktree.sh
          test -z "$(git status --short)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
          ./script/verify_s0_private_canvas.sh --repo-root "$GITHUB_WORKSPACE" --package-manifest-only

      - name: Direct private Release evidence
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/minddesk-release-direct.XXXXXX")"
          evidence="$(mktemp -d "$RUNNER_TEMP/minddesk-release-evidence.XXXXXX")"
          trap 'rm -rf -- "$scratch" "$evidence"' EXIT
          swift build --package-path "$GITHUB_WORKSPACE" --scratch-path "$scratch" -c release
          bin_dir="$(swift build --package-path "$GITHUB_WORKSPACE" --scratch-path "$scratch" -c release --show-bin-path)"
          description="$(find -P "$scratch" -type f -path '*/release/description.json' -print -quit)"
          ./script/verify_s0_private_canvas.sh --repo-root "$GITHUB_WORKSPACE" --scratch-path "$scratch" \
            --configuration release --build-description "$description" --evidence-dir "$evidence" --binary "$bin_dir/MindDesk"
          shasum -a 256 "$bin_dir/MindDesk"
          ./script/verify_release_worktree.sh
          test "$SOURCE_HEAD" = "$(git rev-parse HEAD)"

      - name: Run release self-tests
        shell: bash
        run: |
          set -euo pipefail
          bash script/test_verify_s0_private_canvas.sh
          bash script/test_release_artifact_verifier.sh
          bash script/test_release_package_failure_diagnostics.sh
          bash script/test_release_workflow_guards.sh
          bash script/test_release_worktree_guard.sh
          git diff --check

      - name: Validate signing secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD CODESIGN_IDENTITY TEAM_ID API_KEY_BASE64 API_KEY_ID API_ISSUER_ID; do
            test -n "${!value}" || { echo "::error::$value is missing"; exit 1; }
          done

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/minddesk-signing.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode >"$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Decode notarization key
        shell: bash
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          echo "$API_KEY_BASE64" | base64 --decode >"$path"
          chmod 0600 "$path"
          echo "API_KEY_PATH=$path" >>"$GITHUB_ENV"

      - name: Build, sign, notarize, and staple verified release
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ./script/package_release.sh --mode notarized --identity "$CODESIGN_IDENTITY" --team-id "$TEAM_ID" \
            --notary-key "$API_KEY_PATH" --notary-key-id "$NOTARY_KEY_ID" --notary-issuer "$NOTARY_ISSUER"

      - name: Export verified release paths and digests
        id: verified_release_artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' <VERSION)"
          dir="dist/release/MindDesk-v${version}-${RELEASE_PLATFORM_SUFFIX}/artifacts"
          name="MindDesk-v${version}-${RELEASE_PLATFORM_SUFFIX}"
          ./script/verify_release_artifacts.sh --artifact-dir "$dir" --source-head "$SOURCE_HEAD" --version "$version" --suffix "$RELEASE_PLATFORM_SUFFIX" --mode notarized
          emit() { key="$1"; path="$2"; echo "${key}_path=$path" >>"$GITHUB_OUTPUT"; echo "${key}_sha256=$(shasum -a 256 "$path" | awk '{print $1}')" >>"$GITHUB_OUTPUT"; }
          emit zip "$dir/$name.zip"
          emit dmg "$dir/$name.dmg"
          emit build_provenance "$dir/build-provenance.json"
          emit normalized_plan "$dir/normalized-build-plan.json"
          emit source_policy "$dir/source-policy-evidence.json"
          emit pre_sign_manifest "$dir/pre-sign.bundle.manifest.json"
          emit final_app_manifest "$dir/final-app.bundle.manifest.json"
          emit verified_artifacts "$dir/verified-artifacts.json"
          emit checksums "$dir/SHA256SUMS.txt"
          ./script/verify_release_worktree.sh
          test "$SOURCE_HEAD" = "$(git rev-parse HEAD)"

      - name: Recheck exported release digests
        shell: bash
        env:
          ZIP: ${{ steps.verified_release_artifacts.outputs.zip_path }}|${{ steps.verified_release_artifacts.outputs.zip_sha256 }}
          DMG: ${{ steps.verified_release_artifacts.outputs.dmg_path }}|${{ steps.verified_release_artifacts.outputs.dmg_sha256 }}
          PROVENANCE: ${{ steps.verified_release_artifacts.outputs.build_provenance_path }}|${{ steps.verified_release_artifacts.outputs.build_provenance_sha256 }}
          PLAN: ${{ steps.verified_release_artifacts.outputs.normalized_plan_path }}|${{ steps.verified_release_artifacts.outputs.normalized_plan_sha256 }}
          POLICY: ${{ steps.verified_release_artifacts.outputs.source_policy_path }}|${{ steps.verified_release_artifacts.outputs.source_policy_sha256 }}
          PRE: ${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_path }}|${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_sha256 }}
          FINAL: ${{ steps.verified_release_artifacts.outputs.final_app_manifest_path }}|${{ steps.verified_release_artifacts.outputs.final_app_manifest_sha256 }}
          VERIFIED: ${{ steps.verified_release_artifacts.outputs.verified_artifacts_path }}|${{ steps.verified_release_artifacts.outputs.verified_artifacts_sha256 }}
          CHECKSUMS: ${{ steps.verified_release_artifacts.outputs.checksums_path }}|${{ steps.verified_release_artifacts.outputs.checksums_sha256 }}
        run: |
          for item in "$ZIP" "$DMG" "$PROVENANCE" "$PLAN" "$POLICY" "$PRE" "$FINAL" "$VERIFIED" "$CHECKSUMS"; do
            path="${item%|*}"; expected="${item##*|}"
            test "$(shasum -a 256 "$path" | awk '{print $1}')" = "$expected"
          done

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: minddesk-${{ steps.release_suffix.outputs.release_platform_suffix }}-release
          path: |
            ${{ steps.verified_release_artifacts.outputs.zip_path }}
            ${{ steps.verified_release_artifacts.outputs.dmg_path }}
            ${{ steps.verified_release_artifacts.outputs.build_provenance_path }}
            ${{ steps.verified_release_artifacts.outputs.normalized_plan_path }}
            ${{ steps.verified_release_artifacts.outputs.source_policy_path }}
            ${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_path }}
            ${{ steps.verified_release_artifacts.outputs.final_app_manifest_path }}
            ${{ steps.verified_release_artifacts.outputs.verified_artifacts_path }}
            ${{ steps.verified_release_artifacts.outputs.checksums_path }}

      - name: Create draft GitHub Release
        if: ${{ inputs.publish_github_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.verified_release_artifacts.outputs.zip_path }}
          DMG: ${{ steps.verified_release_artifacts.outputs.dmg_path }}
          PROVENANCE: ${{ steps.verified_release_artifacts.outputs.build_provenance_path }}
          PLAN: ${{ steps.verified_release_artifacts.outputs.normalized_plan_path }}
          POLICY: ${{ steps.verified_release_artifacts.outputs.source_policy_path }}
          PRE: ${{ steps.verified_release_artifacts.outputs.pre_sign_manifest_path }}
          FINAL: ${{ steps.verified_release_artifacts.outputs.final_app_manifest_path }}
          VERIFIED: ${{ steps.verified_release_artifacts.outputs.verified_artifacts_path }}
          CHECKSUMS: ${{ steps.verified_release_artifacts.outputs.checksums_path }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' <VERSION)"
          if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version already exists; refusing to replace assets" >&2; exit 1; fi
          gh release create "v$version" "$ZIP" "$DMG" "$PROVENANCE" "$PLAN" "$POLICY" "$PRE" "$FINAL" "$VERIFIED" "$CHECKSUMS" \
            --draft --title "MindDesk v$version" --notes-file "docs/releases/v$version.md"
